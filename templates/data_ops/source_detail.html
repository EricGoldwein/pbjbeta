{% extends "data_ops/base.html" %}
{% block title %}{{ record.human_name }}{% endblock %}
{% block content %}
<section class="do-page-head do-page-head-compact">
  <div>
    <h1>{{ record.human_name }}</h1>
    <p class="do-mono do-muted do-small">{{ record.source_id }} · {{ record.cms_dataset_id or 'no dataset id' }}</p>
  </div>
  <p class="do-back-link"><a href="{{ url_for('sources') }}">← Sources</a></p>
</section>

{% include 'data_ops/partials/source_detail_panel.html' %}
{% endblock %}
