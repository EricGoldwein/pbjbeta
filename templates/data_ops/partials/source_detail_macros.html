{% macro render_workflow_action(action) %}
{% if action and action.wired %}
  {% set args = action.get('endpoint_args') or {} %}
  {% if action.get('method') == 'post' and not action.get('read_only') %}
  <form class="do-inline" method="post" action="{{ url_for(action.endpoint, **args) }}">
    <button class="do-btn do-btn-compact do-btn-primary" type="submit">{{ action.label }}</button>
  </form>
  {% else %}
  <a class="do-btn do-btn-compact{% if action.get('read_only') %} do-btn-ghost{% else %} do-btn-primary{% endif %}" href="{{ url_for(action.endpoint, **args) }}">{{ action.label }}</a>
  {% endif %}
{% endif %}
{% endmacro %}
