{# Prominent Chart / Table / Both — JS moves this into chart or table card header #}
            <div class="pbj-bench-view-chrome" data-bench-toolbar="{{ bench_topic }}" data-bench-chart-anchor="{{ bench_chart_anchor|default('') }}" data-bench-table-anchor="{{ bench_table_anchor|default('') }}">
                <div class="pbj-bench-view-control-inner d-flex flex-wrap align-items-center gap-2">
                    <span class="pbj-bench-view-kicker">View</span>
                    <div class="btn-group btn-group-sm pbj-bench-view-toggle" role="group" aria-label="{{ bench_topic_label|default(bench_topic) }} — chart or table">
                        <input type="radio" class="btn-check pbj-bench-view-radio" name="pbjBenchView_{{ bench_topic }}" id="pbjBenchView_{{ bench_topic }}_chart" value="chart" autocomplete="off"{% if bench_default_view == 'chart' %} checked{% endif %}{% if bench_chart_available == false %} disabled{% endif %}>
                        <label class="btn{% if bench_chart_available == false %} disabled{% endif %}" for="pbjBenchView_{{ bench_topic }}_chart" title="Chart"><span class="d-md-none"><i class="fas fa-chart-line" aria-hidden="true"></i><span class="visually-hidden">Chart</span></span><span class="d-none d-md-inline">Chart</span></label>
                        <input type="radio" class="btn-check pbj-bench-view-radio" name="pbjBenchView_{{ bench_topic }}" id="pbjBenchView_{{ bench_topic }}_table" value="table" autocomplete="off"{% if bench_default_view == 'table' %} checked{% endif %}>
                        <label class="btn" for="pbjBenchView_{{ bench_topic }}_table" title="Table"><span class="d-md-none"><i class="fas fa-table" aria-hidden="true"></i><span class="visually-hidden">Table</span></span><span class="d-none d-md-inline">Table</span></label>
                        <input type="radio" class="btn-check pbj-bench-view-radio" name="pbjBenchView_{{ bench_topic }}" id="pbjBenchView_{{ bench_topic }}_both" value="both" autocomplete="off"{% if bench_default_view == 'both' %} checked{% endif %}{% if bench_chart_available == false %} disabled{% endif %}>
                        <label class="btn{% if bench_chart_available == false %} disabled{% endif %}" for="pbjBenchView_{{ bench_topic }}_both" title="Chart and table"><span class="d-md-none"><i class="fas fa-table-columns" aria-hidden="true"></i><span class="visually-hidden">Both</span></span><span class="d-none d-md-inline">Both</span></label>
                    </div>
                </div>
            </div>
