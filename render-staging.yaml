services:
  - type: web
    name: pbj-dashboard-staging
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run ultra_minimal_test.py --server.port $PORT --server.address 0.0.0.0
    autoDeploy: false
    healthCheckPath: /
    envVars:
      - key: STAGING
        value: "true"
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
